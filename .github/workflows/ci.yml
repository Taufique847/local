name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — typecheck, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Type check tests
        # Tests are excluded from the build tsconfig so they never reach dist/,
        # which means `npm run typecheck` does not see them.
        run: npm run typecheck:tests

      - name: Test
        # Covers the paths a QA pass found a critical cross-tenant hole in, plus
        # the webhook signature checks that stand between a forged HTTP request
        # and a free Enterprise subscription. mongodb-memory-server downloads a
        # mongod binary on first run, hence the generous timeout.
        run: npm test
        timeout-minutes: 15

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        # Advisory only: a new upstream advisory should not block a hotfix, but it
        # must be visible in the run.
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        # Placeholder public values: NEXT_PUBLIC_* are inlined at build time, so
        # the build needs them present even though CI never serves the output.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  secrets-scan:
    name: Check for committed secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fail if credential files are tracked
        # A real `.env` or a populated cookie jar in the repo is how auth tokens
        # leak. This fires on the filename, before anyone has to judge whether a
        # given file happens to hold a live session — which is the judgement call
        # that gets skipped under time pressure.
        run: |
          set -e
          offenders=$(git ls-files \
            | grep -E '(^|/)(\.env(\..*)?|cookies\.txt|.*\.pem|.*\.p12|.*\.pfx)$' \
            | grep -v '\.env\.example$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Credential files are tracked in git:"
            echo "$offenders"
            exit 1
          fi
          echo "No credential files tracked."

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5000
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max
